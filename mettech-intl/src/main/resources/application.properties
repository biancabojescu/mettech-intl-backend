# Local secrets are kept outside version control. Start from the module directory.
spring.config.import=optional:file:./.env[.properties]

management.endpoints.jmx.exposure.include=*

server.port: 8082

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

spring-doc.swagger-ui.port=8082

encryption.salt.rounds=10

jwt.algorithm.key=${JWT_ALGORITHM_KEY}
jwt.issuer=mettech-intl
jwt.expiryInSeconds=604800

email.from=${EMAIL_FROM}

app.frontend.url=${APP_FRONTEND_URL}

# SMTP configuration supplied by the local environment.
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

